# GitHub Pages: the whole library at https://<owner>.github.io/<repo>/ with
# no account beyond GitHub (ADR-0012). Builds the single-origin bundle (every
# story in the opaque sandbox) from the `content` branch — or, before the
# first publish, from the books in stories/ — and deploys it with GitHub's
# Pages actions. (A branch-based deploy would not work: pushes made with
# GITHUB_TOKEN do not trigger Pages builds.)
#
# One-time settings: Settings → Pages → Source: "GitHub Actions"; and `main`
# as the default branch (the github-pages environment only accepts
# deployments from the default branch). Turn this workflow off with the
# repository variable PAGES_DISABLED=true (e.g. when you move to Cloudflare).
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  # after every publish / promote / rollback / disable / enable
  workflow_run:
    workflows: [publish]
    types: [completed]
  workflow_dispatch:

# never cancel a deployment half-way; queue the next one instead
concurrency:
  group: storyframe-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Skip quietly (with a notice saying which setting to change) until Pages
  # is switched to "GitHub Actions" — instead of failing in deploy-pages.
  # Fails open: any answer other than a clear "not enabled" proceeds.
  check:
    if: >-
      vars.PAGES_DISABLED != 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o pages.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off. Settings → Pages → Source: GitHub Actions, then run this workflow again (DEPLOY.md §0)."
          elif [ "$code" = "200" ] && grep -q '"build_type": *"legacy"' pages.json; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages deploys from a branch. Settings → Pages → Source: GitHub Actions, then run this workflow again (DEPLOY.md §0)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH || 'main' }}
      # <owner>.github.io repos are served at the root; project repos under /<repo>/
      PAGES_URL: >-
        ${{ vars.PAGES_URL
            || (endsWith(github.event.repository.name, '.github.io') && format('https://{0}', github.event.repository.name))
            || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run sdk:build

      - name: The published library (content branch, or stories/ before the first publish)
        env:
          STORYFRAME_ACTOR: github-pages-bootstrap
        run: |
          if git ls-remote --exit-code --heads origin content > /dev/null; then
            node scripts/ci/content-branch.mjs checkout
            echo "Library: the \`content\` branch." >> "$GITHUB_STEP_SUMMARY"
          else
            node packages/story-cli/src/storyframe.mjs build --all
            node packages/story-cli/src/storyframe.mjs publish --all --channel production
            echo "::notice::No content branch yet — built the books in stories/. The first publish run creates it."
            echo "Library: built from \`stories/\` (no \`content\` branch yet)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - run: npm --workspace apps/web run build

      - name: Install a browser for PNG share cards
        continue-on-error: true
        run: npx playwright install chromium

      - name: Bundle for GitHub Pages
        run: >-
          node scripts/deploy-bundle.mjs --only pages
          --app-origin "$PAGES_URL" --repo "${{ github.repository }}" --branch "$SOURCE_BRANCH"
          --supabase-url "${{ vars.SUPABASE_URL }}" --supabase-anon-key "${{ vars.SUPABASE_ANON_KEY }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "Deployed → ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
